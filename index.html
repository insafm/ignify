<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IGNOU BCA_NEW Prep Portal</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="IGNOU BCA_NEW Comprehensive Exam Analysis & Canonical Question Bank">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- KaTeX CSS for Math Formulas -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>

  <!-- Docsify Darklight Theme CSS -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" title="docsify-darklight-theme" type="text/css"/>

  <!-- Enhanced Eye-Friendly & High-Contrast Typography Styles -->
  <style>
    :root {
      --site-font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --code-font: 'JetBrains Mono', Consolas, Monaco, monospace;
      --primary: #4f46e5;
      --radius: 10px;
    }

    body {
      font-family: var(--site-font) !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.75;
      letter-spacing: -0.01em;
    }

    /* Content Area Max Width */
    .markdown-section {
      max-width: 880px !important;
      margin: 0 auto;
      padding: 30px 40px 80px 40px !important;
    }

    /* Headings */
    .markdown-section h1 {
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-top: 1.5rem;
      margin-bottom: 1.25rem;
      line-height: 1.25;
      color: var(--textColor);
    }
    .markdown-section h2 {
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 2.25rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--borderColor, rgba(148, 163, 184, 0.2));
      padding-bottom: 0.5rem;
      color: var(--textColor);
    }
    .markdown-section h3 {
      font-weight: 600;
      letter-spacing: -0.015em;
      margin-top: 1.5rem;
      color: var(--textColor);
    }

    /* Sidebar Navigation */
    .sidebar {
      border-right: 1px solid var(--borderColor, rgba(148, 163, 184, 0.18));
      font-size: 0.92rem;
      width: 300px !important;
    }
    .content {
      left: 300px !important;
    }
    .sidebar-nav ul {
      padding-left: 1.1rem;
    }
    .sidebar-nav > ul > li {
      margin-bottom: 0.75rem;
    }
    .sidebar-nav strong {
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--textColor);
      opacity: 0.7;
      display: inline-block;
      margin-top: 0.4rem;
    }
    .sidebar-nav a {
      transition: all 0.15s ease-in-out;
      border-radius: 6px;
      padding: 2px 6px;
    }

    /* Eye-Friendly Question Cards (Theme-Adaptive via CSS Variables) */
    .question-box {
      border: 1px solid var(--borderColor, #e2e8f0);
      border-radius: var(--radius);
      padding: 1.4rem;
      margin: 1.5rem 0;
      background: var(--codeBackgroundColor, #f8fafc) !important;
      color: var(--textColor, #1e293b) !important;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .question-box:hover {
      border-color: var(--accent, #6366f1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    .question-box h3,
    .question-box p,
    .question-box span,
    .question-box strong,
    .question-box li {
      color: var(--textColor, inherit) !important;
    }
    .question-box blockquote {
      margin: 0.9rem 0 0.2rem 0;
      padding: 0.5rem 1rem;
      border-left: 3px solid var(--accent, #6366f1);
      background: rgba(99, 102, 241, 0.06);
      color: var(--textColor, inherit) !important;
      border-radius: 0 6px 6px 0;
    }
    .question-box blockquote code {
      color: var(--textColor, inherit) !important;
      background: rgba(0, 0, 0, 0.15);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.6rem;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 9999px;
      letter-spacing: 0.04em;
      margin-right: 0.35rem;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
    }
    .badge-vhigh {
      background-color: rgba(239, 68, 68, 0.14);
      color: #ef4444 !important;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .badge-high {
      background-color: rgba(245, 158, 11, 0.14);
      color: #f59e0b !important;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .badge-medium {
      background-color: rgba(14, 165, 233, 0.14);
      color: #0ea5e9 !important;
      border: 1px solid rgba(14, 165, 233, 0.3);
    }
    .badge-low {
      background-color: rgba(148, 163, 184, 0.14);
      color: #64748b !important;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }
    .badge-topic {
      background-color: rgba(139, 92, 246, 0.14);
      color: #8b5cf6 !important;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }
    .badge-freq {
      background-color: rgba(34, 197, 94, 0.14);
      color: #22c55e !important;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .badge-qid {
      background-color: rgba(168, 85, 247, 0.15);
      color: #a855f7 !important;
      font-weight: 800;
      font-family: var(--code-font);
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    /* High Contrast in Dark Mode for Badges */
    [data-theme="dark"] .badge-vhigh,
    html[style*="color-scheme: dark"] .badge-vhigh {
      color: #fca5a5 !important;
      background-color: rgba(239, 68, 68, 0.2);
    }
    [data-theme="dark"] .badge-high,
    html[style*="color-scheme: dark"] .badge-high {
      color: #fcd34d !important;
      background-color: rgba(245, 158, 11, 0.2);
    }
    [data-theme="dark"] .badge-medium,
    html[style*="color-scheme: dark"] .badge-medium {
      color: #7dd3fc !important;
      background-color: rgba(14, 165, 233, 0.2);
    }
    [data-theme="dark"] .badge-low,
    html[style*="color-scheme: dark"] .badge-low {
      color: #cbd5e1 !important;
      background-color: rgba(148, 163, 184, 0.2);
    }
    [data-theme="dark"] .badge-topic,
    html[style*="color-scheme: dark"] .badge-topic {
      color: #c4b5fd !important;
      background-color: rgba(139, 92, 246, 0.2);
    }
    [data-theme="dark"] .badge-freq,
    html[style*="color-scheme: dark"] .badge-freq {
      color: #86efac !important;
      background-color: rgba(34, 197, 94, 0.2);
    }
    [data-theme="dark"] .badge-qid,
    html[style*="color-scheme: dark"] .badge-qid {
      color: #d8b4fe !important;
      background-color: rgba(168, 85, 247, 0.2);
    }

    /* Tables (High Contrast in Both Themes) */
    .markdown-section table {
      display: table !important;
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: 1.75rem 0;
      font-size: 0.92rem;
      border: 1px solid var(--borderColor, #e2e8f0);
      border-radius: 8px;
      overflow: hidden;
      background: var(--codeBackgroundColor, #ffffff);
    }
    .markdown-section table th {
      background-color: var(--borderColor, #f8fafc);
      font-weight: 700;
      color: var(--textColor, #334155);
      text-align: left;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--borderColor, #cbd5e1);
      border-right: 1px solid var(--borderColor, #e2e8f0);
    }
    .markdown-section table th:last-child {
      border-right: none;
    }
    .markdown-section table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--borderColor, #f1f5f9);
      border-right: 1px solid var(--borderColor, #f1f5f9);
      vertical-align: middle;
      color: var(--textColor, inherit);
    }
    .markdown-section table td:last-child {
      border-right: none;
    }
    .markdown-section table tr:last-child td {
      border-bottom: none;
    }

    /* Callouts */
    .callout {
      border-left: 4px solid var(--accent, #4f46e5);
      background: rgba(79, 70, 229, 0.08);
      padding: 0.9rem 1.2rem;
      border-radius: 0 var(--radius) var(--radius) 0;
      margin: 1.4rem 0;
      color: var(--textColor, inherit);
    }
    .callout-important {
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.08);
    }

    /* Code styling */
    code, pre {
      font-family: var(--code-font) !important;
      font-size: 0.88rem !important;
    }
    .markdown-section pre {
      border-radius: 8px;
      padding: 1.1rem 1.25rem;
      background: #111827 !important;
      border: 1px solid var(--borderColor, #1f2937);
    }

    /* Subtle Minimal Footer */
    .portal-footer {
      margin-top: 50px;
      padding-top: 24px;
      border-top: 1px solid var(--borderColor, #e2e8f0);
      text-align: center;
      font-size: 0.84rem;
      color: var(--textColor, #64748b);
      opacity: 0.75;
    }
    .portal-footer a {
      color: var(--accent, #4f46e5);
      font-weight: 600;
      text-decoration: none;
    }
    .portal-footer a:hover {
      text-decoration: underline;
    }

    /* Cover Page (Neutral & Non-Green if enabled) */
    section.cover {
      background: var(--background, #ffffff) !important;
    }
    section.cover .cover-main {
      max-width: 800px;
      color: var(--textColor) !important;
    }
    section.cover h1 {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--textColor) !important;
    }
    section.cover a {
      border-radius: 8px !important;
      border: 1px solid var(--accent, #4f46e5) !important;
      color: var(--accent, #4f46e5) !important;
    }
    section.cover a:hover {
      background: var(--accent, #4f46e5) !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body>
  <div id="app">Loading IGNOU BCA_NEW Prep Portal...</div>
  <script>
    window.$docsify = {
      name: 'IGNOU BCA_NEW Prep',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: false,
      onlyCover: false,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search questions, topics, concepts...',
        noData: 'No matching questions or topics found',
        depth: 4,
        hideOtherSidebarContent: false
      },
      pagination: {
        previousText: 'Previous Guide',
        nextText: 'Next Guide',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: 'Copy Code',
        errorText: 'Error',
        successText: 'Copied!'
      },
      darklightTheme: {
        siteFont: 'Plus Jakarta Sans',
        defaultTheme: 'light',
        codeFontFamily: 'JetBrains Mono, monospace',
        bodyFontSize: '16px',
        dark: {
          accent: '#818cf8',
          toogleBackground: '#ffffff',
          background: '#0a0f1d',
          textColor: '#e2e8f0',
          codeTextColor: '#f8fafc',
          codeBackgroundColor: '#111827',
          borderColor: '#1e293b',
          blockQuoteColor: '#94a3b8',
          highlightColor: '#818cf8',
          sidebarSublink: '#94a3b8',
          coverBackground: '#0a0f1d'
        },
        light: {
          accent: '#4f46e5',
          toogleBackground: '#0a0f1d',
          background: '#ffffff',
          textColor: '#1e293b',
          codeTextColor: '#0f172a',
          codeBackgroundColor: '#f8fafc',
          borderColor: '#e2e8f0',
          blockQuoteColor: '#64748b',
          highlightColor: '#4f46e5',
          sidebarSublink: '#64748b',
          coverBackground: '#ffffff'
        }
      },
      plugins: [
        function(hook, vm) {
          // Subtle, minimal single footer at bottom of articles
          hook.afterEach(function(html) {
            var footer = [
              '<footer class="portal-footer">',
              '  <p>IGNOU BCA_NEW Exam Prep Portal • Curated by <a href="https://mohammedinsaf.com" target="_blank" rel="noopener">Mohammed Insaf M</a></p>',
              '</footer>'
            ].join('\n');
            return html + footer;
          });

          // Sync theme attribute to HTML tag for CSS selectors
          hook.doneEach(function() {
            var currentTheme = localStorage.getItem('DARK_LIGHT_THEME') || 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
          });

          // Sanitize search results: strip any raw HTML tags from search previews
          hook.ready(function() {
            var cleanSearchSnippets = function() {
              var snippets = document.querySelectorAll('.results-panel .matching-post p, .results-panel .matching-post h2');
              snippets.forEach(function(el) {
                if (el.innerHTML.indexOf('<') !== -1) {
                  // Keep search highlight <em class="search-keyword">, strip all other HTML tags
                  el.innerHTML = el.innerHTML.replace(/<(?!\/?em\b)[^>]+>/gi, '');
                }
              });
            };
            var searchContainer = document.querySelector('.sidebar') || document.body;
            var observer = new MutationObserver(cleanSearchSnippets);
            observer.observe(searchContainer, { childList: true, subtree: true });
          });
        }
      ]
    }
  </script>
  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  
  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>

  <!-- KaTeX for LaTeX Math -->
  <script src="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>

  <!-- Prism Syntax Highlighting for C/C++ -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
</body>
</html>
